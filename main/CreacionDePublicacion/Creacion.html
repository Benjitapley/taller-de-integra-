<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crear publicación | Hay cupo</title>

  <link rel="stylesheet" href="creacion.css">

  <script src="ubicacion.js" defer></script>
  <script src="creacion.js" defer></script>
</head>

<body>
  <header class="barra-superior">
    <a class="logo" href="/">Hay<br>cupo?</a>
  </header>

  <main class="contenedor">
    <a class="volver" href="/">Volver</a>

    <section class="crear-publicacion">
      <h1>Crear publicación</h1>

      <p class="subtitulo">
        Comparte tu arriendo o encuentra un lugar para vivir.
      </p>

      <form
        id="crear-publicacion"
        class="formulario-publicacion"
        action="/api/publicaciones"
        method="post"
        enctype="multipart/form-data"
      >
        <h2>Contenido de la publicación</h2>

        <div class="campo">
          <label for="titulo">Título</label>

          <input
            type="text"
            id="titulo"
            name="titulo"
            placeholder="Escribe un título"
            maxlength="200"
            required
          >
        </div>

        <div class="fila">
          <div class="campo">
            <label for="categoria">
              ¿Buscas u ofreces arriendo?
            </label>

            <select id="categoria" name="categoria" required>
              <option value="" disabled selected>
                Selecciona una categoría
              </option>
              <option value="busco">Busco arriendo</option>
              <option value="ofrezco">Ofrezco arriendo</option>
            </select>
          </div>

          <div class="campo">
            <label for="ubicacion">Ubicación</label>

            <input
              type="text"
              id="ubicacion"
              name="ubicacion"
              placeholder="Escribe una dirección o ciudad"
              maxlength="250"
              list="sugerencias-ubicacion"
              aria-describedby="estado-ubicacion"
              autocomplete="off"
              required
            >

            <datalist id="sugerencias-ubicacion"></datalist>

            <small id="estado-ubicacion" role="status"></small>

            <small>
              Powered by
              <a href="https://www.geoapify.com/">Geoapify</a>
            </small>
          </div>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="precio">Precio</label>

            <input
              type="number"
              id="precio"
              name="precio"
              placeholder="Escribe el precio"
              min="0"
              max="1000000000000"
              step="1"
              required
            >
          </div>

          <div class="campo">
            <label for="tipo-vivienda">Tipo de vivienda</label>

            <select
              id="tipo-vivienda"
              name="tipo_vivienda"
              required
            >
              <option value="" disabled selected>
                Selecciona una opción
              </option>
              <option value="casa">Casa</option>
              <option value="departamento">Departamento</option>
              <option value="habitacion">Habitación</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <label for="descripcion">Descripción</label>

          <textarea
            id="descripcion"
            name="descripcion"
            placeholder="Describe lo que ofreces o lo que estás buscando..."
            rows="8"
            maxlength="5000"
            required
          ></textarea>
        </div>

        <div class="campo">
          <label for="imagen">Imagen (opcional)</label>

          <input
            type="file"
            id="imagen"
            name="imagen"
            accept="image/jpeg,image/png,image/webp"
            aria-describedby="ayuda-imagen"
          >

          <small id="ayuda-imagen">
            Formatos permitidos: JPG, PNG o WEBP. Máximo 5 MB.
          </small>
        </div>

        <div class="campo-checkbox">
          <input
            type="checkbox"
            id="permitir-comentarios"
            name="permitir_comentarios"
            value="true"
            checked
          >

          <label for="permitir-comentarios">
            Permitir comentarios
          </label>
        </div>

        <div class="acciones">
          <button type="reset" class="boton-secundario">
            Limpiar formulario
          </button>

          <button type="submit" class="boton-primario">
            Publicar
          </button>
        </div>

        <p id="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="pie-pagina">
    <p>&copy; 2026 Hay cupo</p>
  </footer>
</body>
</html>
