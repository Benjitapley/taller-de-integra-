<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Crear publicación | Hay cupo?
  </title>


  <link
    rel="stylesheet"
    href="/static/creacion.css"
  >


  <script
    src="/static/ubicacion.js?v=3"
    defer
  ></script>


  <script
    src="/static/creacion.js?v=3"
    defer
  ></script>

</head>


<body>


  <!-- ================================================== -->
  <!-- HEADER -->
  <!-- ================================================== -->

  <header class="barra-superior">

    <a
      class="logo"
      href="/"
    >
      Hay<br>cupo?
    </a>

  </header>


  <!-- ================================================== -->
  <!-- CONTENIDO -->
  <!-- ================================================== -->

  <main class="contenedor">


    <a
      class="volver"
      href="/"
    >
      Volver
    </a>


    <section class="crear-publicacion">


      <!-- ================================================= -->
      <!-- TÍTULO -->
      <!-- ================================================= -->

      <h1 id="titulo-pagina">
        Crear publicación
      </h1>


      <!-- ================================================= -->
      <!-- AVISO MODO EDICIÓN -->
      <!-- ================================================= -->

      <div
        id="modo-edicion"
        hidden
      >

        <p>

          Estás editando la publicación

          <strong>
            #<span id="numero-publicacion"></span>
          </strong>

        </p>

      </div>


      <p
        class="subtitulo"
        id="subtitulo-pagina"
      >
        Comparte tu arriendo o encuentra
        un lugar para vivir.
      </p>


      <!-- ================================================= -->
      <!-- FORMULARIO -->
      <!-- ================================================= -->

      <form
        id="crear-publicacion"
        class="formulario-publicacion"
        action="/api/publicaciones"
        method="post"
        enctype="multipart/form-data"
      >


        <!-- ID DE LA PUBLICACIÓN -->

        <input
          type="hidden"
          id="id-publicacion"
        >


        <h2>
          Contenido de la publicación
        </h2>


        <!-- ================================================= -->
        <!-- TÍTULO -->
        <!-- ================================================= -->

        <div class="campo">

          <label for="titulo">
            Título
          </label>

          <input
            type="text"
            id="titulo"
            name="titulo"
            placeholder="Escribe un título"
            maxlength="200"
            required
          >

        </div>


        <!-- ================================================= -->
        <!-- CATEGORÍA Y UBICACIÓN -->
        <!-- ================================================= -->

        <div class="fila">


          <div class="campo">

            <label for="categoria">

              ¿Buscas u ofreces arriendo?

            </label>


            <select
              id="categoria"
              name="categoria"
              required
            >

              <option
                value=""
                disabled
                selected
              >
                Selecciona una categoría
              </option>


              <option value="busco">
                Busco arriendo
              </option>


              <option value="ofrezco">
                Ofrezco arriendo
              </option>

            </select>

          </div>


          <div class="campo">

            <label for="ubicacion">
              Ubicación
            </label>


            <input
              type="text"
              id="ubicacion"
              name="ubicacion"
              placeholder="Escribe una dirección o ciudad"
              maxlength="250"
              list="sugerencias-ubicacion"
              aria-describedby="estado-ubicacion"
              autocomplete="off"
              required
            >


            <datalist
              id="sugerencias-ubicacion"
            >
            </datalist>


            <small
              id="estado-ubicacion"
              role="status"
            >
            </small>


            <small>

              Powered by

              <a
                href="https://www.geoapify.com/"
                target="_blank"
                rel="noopener noreferrer"
              >
                Geoapify
              </a>

            </small>

          </div>

        </div>


        <!-- ================================================= -->
        <!-- PRECIO Y VIVIENDA -->
        <!-- ================================================= -->

        <div class="fila">


          <div class="campo">

            <label for="precio">
              Precio
            </label>


            <input
              type="number"
              id="precio"
              name="precio"
              placeholder="Escribe el precio"
              min="0"
              max="999999999999.99"
              step="0.01"
              required
            >

          </div>


          <div class="campo">

            <label for="tipo-vivienda">
              Tipo de vivienda
            </label>


            <select
              id="tipo-vivienda"
              name="tipo_vivienda"
              required
            >

              <option
                value=""
                disabled
                selected
              >
                Selecciona una opción
              </option>


              <option value="casa">
                Casa
              </option>


              <option value="departamento">
                Departamento
              </option>


              <option value="habitacion">
                Habitación
              </option>

            </select>

          </div>

        </div>


        <!-- ================================================= -->
        <!-- TIPO Y CUPOS -->
        <!-- ================================================= -->

        <div class="fila">


          <div class="campo">

            <label for="tipo-publicacion">
              Tipo de publicación
            </label>


            <select
              id="tipo-publicacion"
              name="tipo"
              required
            >

              <option
                value=""
                disabled
                selected
              >
                Selecciona una opción
              </option>


              <option value="Arrendador">
                Arrendador
              </option>


              <option value="Compartida">
                Compartida
              </option>

            </select>

          </div>


          <div class="campo">

            <label for="cupos-totales">
              Cupos totales
            </label>


            <input
              type="number"
              id="cupos-totales"
              name="cupos_totales"
              placeholder="Cantidad de cupos"
              min="1"
              max="2147483647"
              step="1"
              required
            >

          </div>

        </div>


        <!-- ================================================= -->
        <!-- DESCRIPCIÓN -->
        <!-- ================================================= -->

        <div class="campo">

          <label for="descripcion">
            Descripción
          </label>


          <textarea
            id="descripcion"
            name="descripcion"
            placeholder="Describe lo que ofreces o lo que estás buscando..."
            rows="8"
            maxlength="5000"
            required
          ></textarea>

        </div>


        <!-- ================================================= -->
        <!-- IMAGEN -->
        <!-- ================================================= -->

        <div
          class="campo"
          id="contenedor-imagen"
        >

          <label for="imagen">
            Imagen (opcional)
          </label>


          <input
            type="file"
            id="imagen"
            name="imagen"
            accept="image/jpeg,image/png,image/webp"
            aria-describedby="ayuda-imagen"
          >


          <small id="ayuda-imagen">

            Formatos permitidos:
            JPG, PNG o WEBP.
            Máximo 5 MB.

          </small>

        </div>


        <!-- ================================================= -->
        <!-- COMENTARIOS -->
        <!-- ================================================= -->

        <div class="campo-checkbox">

          <input
            type="checkbox"
            id="permitir-comentarios"
            name="permitir_comentarios"
            value="true"
            checked
          >


          <label for="permitir-comentarios">

            Permitir comentarios

          </label>

        </div>


        <!-- ================================================= -->
        <!-- BOTONES -->
        <!-- ================================================= -->

        <div class="acciones">


          <button
            type="reset"
            class="boton-secundario"
            id="boton-limpiar"
          >
            Limpiar formulario
          </button>


          <button
            type="button"
            class="boton-secundario"
            id="boton-cerrar"
            hidden
          >
            Cerrar publicación
          </button>


          <button
            type="submit"
            class="boton-primario"
            id="boton-publicar"
          >
            Publicar
          </button>


        </div>


        <!-- ================================================= -->
        <!-- MENSAJE -->
        <!-- ================================================= -->

        <p
          id="mensaje"
          role="status"
          aria-live="polite"
        >
        </p>


      </form>


    </section>


  </main>


  <!-- ================================================== -->
  <!-- FOOTER -->
  <!-- ================================================== -->

  <footer class="pie-pagina">

    <p>
      &copy; 2026 Hay cupo
    </p>

  </footer>


</body>

</html>
