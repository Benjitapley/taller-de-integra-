name: roomies-sprint2-local
x-business: &business
  ROOMIES_LOCAL_MODE: "1"
  ROOMIES_AUTH_PROVIDER_URL: ${ROOMIES_LOCAL_AUTH_ORIGIN:?Proveedor Supabase Auth LOCAL requerido}
  ROOMIES_AUTH_PUBLISHABLE_KEY: ${ROOMIES_LOCAL_AUTH_KEY:?Clave publica del proveedor LOCAL requerida}
  ROOMIES_JWT_ISSUER: ${ROOMIES_LOCAL_AUTH_ISSUER:?Issuer LOCAL exacto requerido}
  AUTH_USERS_UPSTREAM_URL: http://auth-users:8000
  LISTADO_UPSTREAM_URL: http://listado-applications:8000
  ROOMIES_INTERNAL_TOKEN: ${ROOMIES_LOCAL_SERVICE_TOKEN:?Token interno local de al menos 32 caracteres}
  ROOMIES_ADMIN_SUBJECTS: ${ROOMIES_LOCAL_ADMIN_UUIDS:-}
services:
  roomies-db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: roomies_local_owner
      POSTGRES_DB: roomies_sprint2_disposable
      POSTGRES_PASSWORD: ${ROOMIES_LOCAL_OWNER_PASSWORD:?Password exclusivo local requerido}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      ROOMIES_AUTH_SQL_PASSWORD: ${ROOMIES_AUTH_SQL_PASSWORD:?Password hexadecimal local requerido}
      ROOMIES_LISTADO_SQL_PASSWORD: ${ROOMIES_LISTADO_SQL_PASSWORD:?Password hexadecimal local requerido}
      ROOMIES_MATCH_SQL_PASSWORD: ${ROOMIES_MATCH_SQL_PASSWORD:?Password hexadecimal local requerido}
    volumes:
      - roomies-local-db:/var/lib/postgresql
      - ./backend/local_stack/bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./backend/local_stack/passwords.sh:/docker-entrypoint-initdb.d/01-passwords.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U roomies_local_owner -d roomies_sprint2_disposable"]
      interval: 5s
      timeout: 3s
      retries: 10
  auth-users:
    build:
      context: .
      dockerfile: backend/services/auth-users-service/Dockerfile
    environment:
      <<: *business
      AUTH_USERS_DATABASE_URL: postgresql://sql_auth_users:${ROOMIES_AUTH_SQL_PASSWORD}@roomies-db:5432/roomies_sprint2_disposable
      SUPABASE_URL: ${ROOMIES_LOCAL_AUTH_ORIGIN}
      SUPABASE_JWT_ISSUER: ${ROOMIES_LOCAL_AUTH_ISSUER}
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_JWT_ALGORITHMS: ES256,RS256
      ROOMIES_IMAGE_DIR: /images
    volumes: [roomies-local-users-images:/images]
    depends_on:
      roomies-db: {condition: service_healthy}
  listado-applications:
    build:
      context: .
      dockerfile: backend/services/listado-applications-service/Dockerfile
    environment:
      <<: *business
      LISTADO_DATABASE_URL: postgresql://sql_listado_applications:${ROOMIES_LISTADO_SQL_PASSWORD}@roomies-db:5432/roomies_sprint2_disposable
      ROOMIES_IMAGE_DIR: /images
    volumes: [roomies-local-publication-images:/images]
    depends_on:
      roomies-db: {condition: service_healthy}
  match-conexion:
    build:
      context: .
      dockerfile: backend/services/match-conexion-service/Dockerfile
    environment:
      <<: *business
      MATCH_DATABASE_URL: postgresql://sql_match_conexion:${ROOMIES_MATCH_SQL_PASSWORD}@roomies-db:5432/roomies_sprint2_disposable
    depends_on:
      roomies-db: {condition: service_healthy}
  api-gateway:
    build: ./backend/api-gateway
    environment:
      ROOMIES_LOCAL_MODE: "1"
      AUTH_USERS_UPSTREAM_URL: http://auth-users:8000
      LISTADO_UPSTREAM_URL: http://listado-applications:8000
      MATCH_UPSTREAM_URL: http://match-conexion:8000
    ports: ["127.0.0.1:8010:8000"]
    depends_on: [auth-users, listado-applications, match-conexion]
  next-web:
    build:
      context: .
      dockerfile: frontend-next/Dockerfile.local
    environment:
      ROOMIES_LOCAL_MODE: "1"
      WEB_AUTH_ENABLED: "true"
      WEB_AUTH_PROVIDER: supabase
      WEB_AUTH_ORIGIN: http://localhost:3000
      WEB_AUTH_FASTAPI_ORIGIN: http://api-gateway:8000
      FASTAPI_ORIGIN: http://api-gateway:8000
      WEB_SUPABASE_ORIGIN: ${ROOMIES_LOCAL_AUTH_ORIGIN}
      WEB_SUPABASE_PUBLISHABLE_KEY: ${ROOMIES_LOCAL_AUTH_KEY}
      WEB_AUTH_RECOVERY_SECRET: ${WEB_AUTH_RECOVERY_SECRET:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api-gateway]
volumes:
  roomies-local-db:
  roomies-local-users-images:
  roomies-local-publication-images:
