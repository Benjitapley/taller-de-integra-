# Preparado, NO activado. No incluye base local, migrador, seed ni proveedor ficticio.
# Requiere SQL/credenciales/Auth aprobados y configurados por el operador.
name: roomies-supabase-localhost
x-runtime: &runtime
  ROOMIES_RUNTIME_MODE: supabase
  ROOMIES_PERSISTENCE_LAYOUT: ${ROOMIES_PERSISTENCE_LAYOUT:-haycupo-v1}
  ROOMIES_SUPABASE_PROJECT_REF: ${ROOMIES_SUPABASE_PROJECT_REF:?Proyecto autorizado requerido}
  ROOMIES_SUPABASE_DB_HOST: ${ROOMIES_SUPABASE_DB_HOST:?Host directo o pooler exacto del Dashboard}
  ROOMIES_AUTH_PROVIDER_URL: https://${ROOMIES_SUPABASE_PROJECT_REF}.supabase.co
  ROOMIES_AUTH_PUBLISHABLE_KEY: ${ROOMIES_SUPABASE_PUBLISHABLE_KEY:?Clave publishable requerida}
  AUTH_USERS_UPSTREAM_URL: http://auth-users:8000
  LISTADO_UPSTREAM_URL: http://listado-applications:8000
  ROOMIES_INTERNAL_TOKEN: ${ROOMIES_INTERNAL_TOKEN:?Secreto interno exclusivo requerido}
  ROOMIES_ADMIN_SUBJECTS: ${ROOMIES_ADMIN_SUBJECTS:-}
services:
  auth-users:
    build:
      context: .
      dockerfile: backend/services/auth-users-service/Dockerfile
    environment:
      <<: *runtime
      AUTH_USERS_DATABASE_URL: ${AUTH_USERS_DATABASE_URL:?DSN sql_auth_users con verify-full y sslrootcert}
      SUPABASE_URL: https://${ROOMIES_SUPABASE_PROJECT_REF}.supabase.co
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_JWT_ALGORITHMS: ES256,RS256
      ROOMIES_IMAGE_DIR: /images
    volumes: [users-images:/images]
  listado-applications:
    build:
      context: .
      dockerfile: backend/services/listado-applications-service/Dockerfile
    environment:
      <<: *runtime
      LISTADO_DATABASE_URL: ${LISTADO_DATABASE_URL:?DSN sql_listado_applications con verify-full y sslrootcert}
      ROOMIES_IMAGE_DIR: /images
    volumes: [publication-images:/images]
  match-conexion:
    build:
      context: .
      dockerfile: backend/services/match-conexion-service/Dockerfile
    environment:
      <<: *runtime
      MATCH_DATABASE_URL: ${MATCH_DATABASE_URL:?DSN sql_match_conexion con verify-full y sslrootcert}
  api-gateway:
    build: ./backend/api-gateway
    environment:
      ROOMIES_RUNTIME_MODE: supabase
      AUTH_USERS_UPSTREAM_URL: http://auth-users:8000
      LISTADO_UPSTREAM_URL: http://listado-applications:8000
      MATCH_UPSTREAM_URL: http://match-conexion:8000
    ports: ["127.0.0.1:8010:8000"]
    depends_on: [auth-users, listado-applications, match-conexion]
  next-web:
    build:
      context: .
      dockerfile: frontend-next/Dockerfile.local
    environment:
      ROOMIES_RUNTIME_MODE: supabase
      ROOMIES_SUPABASE_PROJECT_REF: ${ROOMIES_SUPABASE_PROJECT_REF}
      WEB_AUTH_ENABLED: "true"
      WEB_AUTH_PROVIDER: supabase
      WEB_AUTH_ORIGIN: http://localhost:3000
      WEB_AUTH_FASTAPI_ORIGIN: http://api-gateway:8000
      FASTAPI_ORIGIN: http://api-gateway:8000
      WEB_SUPABASE_ORIGIN: https://${ROOMIES_SUPABASE_PROJECT_REF}.supabase.co
      WEB_SUPABASE_PUBLISHABLE_KEY: ${ROOMIES_SUPABASE_PUBLISHABLE_KEY}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api-gateway]
volumes:
  users-images:
  publication-images:
