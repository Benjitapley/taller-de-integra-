# Overlay local: docker compose -f docker-compose.local.yml -f docker-compose.convivencia.yml up --build
# Aplicar primero la migracion de Convivencia con un rol de migracion autorizado.
# El bootstrap antiguo no crea este rol/esquema; sin migracion, operaciones fallan cerradas.
# La aceptacion de Listado conserva incorporacion_pendiente hasta integrar F01.
services:
  convivencia-mensajeria:
    build:
      context: .
      dockerfile: backend/services/convivencia-mensajeria-service/Dockerfile
    environment:
      ROOMIES_LOCAL_MODE: "1"
      ROOMIES_AUTH_PROVIDER_URL: ${ROOMIES_LOCAL_AUTH_ORIGIN:?Proveedor Supabase Auth LOCAL requerido}
      ROOMIES_JWT_ISSUER: ${ROOMIES_LOCAL_AUTH_ISSUER:?Issuer LOCAL exacto requerido}
      AUTH_USERS_UPSTREAM_URL: http://auth-users:8000
      LISTADO_UPSTREAM_URL: http://listado-applications:8000
      ROOMIES_INTERNAL_TOKEN: ${ROOMIES_LOCAL_SERVICE_TOKEN:?Token interno local requerido}
      CONVIVENCIA_DATABASE_URL: postgresql://sql_convivencia_mensajeria:${ROOMIES_CONVIVENCIA_SQL_PASSWORD:?Password exclusivo de Convivencia requerido}@roomies-db:5432/roomies_sprint2_disposable
    depends_on:
      roomies-db: {condition: service_healthy}
  listado-applications:
    environment:
      CONVIVENCIA_UPSTREAM_URL: http://convivencia-mensajeria:8000
  api-gateway:
    environment:
      CONVIVENCIA_UPSTREAM_URL: http://convivencia-mensajeria:8000
    depends_on: [convivencia-mensajeria]
