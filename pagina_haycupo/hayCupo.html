<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hay cupo</title>
  <link rel="stylesheet" href="estilo_HayCupo.css">
</head>

<body>
  <header>
    <h1>¿Hay cupo?</h1>
    
    <p>Encuentra el lugar ideal para ti o comparte el tuyo.</p>
    <div class="beneficios">

    <a class="boton-registro" href="Auth_app /registro.html">
      Registrarte en ¿Hay cupo?
    </a>
  </header>

  <main>
    <section class="consulta">
      <h2>Consulta de cupos</h2>
      <p>Busca la ubicación que más te interese</p>

      <form action="#" method="get">


        <!-- Búsqueda arriba -->
        <div class="busqueda">
          <label for="consulta">Ubicación</label>

          <div class="barra-busqueda">
            <input
              type="text"
              id="consulta"
              name="consulta"
              placeholder="Escribe la ubicación"
            >
            <button type="submit">Consultar</button>
          </div>
        </div>

        <!-- Filtros debajo -->
        <div class="filtros">
          <div class="filtro">
            <label for="personas">
              ¿Para cuántas personas?
            </label>

            <select id="personas" name="personas">
              <option value="uno">Uno</option>
              <option value="dos">Dos</option>
              <option value="tres">Tres</option>
              <option value="cuatro_o_mas">Cuatro o más</option>
            </select>
          </div>

          <div class="filtro">
            <label for="tipo">Casa o departamento</label>

            <select id="tipo" name="tipo">
              <option value="casa">Casa</option>
              <option value="departamento">Departamento</option>
            </select>
          </div>

          <div class="filtro">
            <label for="mascotas">¿Tiene mascotas?</label>

            <select id="mascotas" name="mascotas">
              <option value="si">Sí</option>
              <option value="no">No</option>
            </select>
          </div>
        </div>
      </form>
    </section>

    <!-- Aquí puedes agregar tus próximas ideas -->
    <div class="espacio-futuro"></div>
  </main>

  <footer>
    <p>&copy; 2026 Hay cupo</p>
  </footer>
</body>
</html>
